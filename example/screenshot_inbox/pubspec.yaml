name: screenshot_inbox_example
description: An on-device agent that reads your screenshots and turns them into calendar events, map searches and copied codes, through llamadart's tool calling and vision input.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  flutter:
    sdk: flutter
  llamadart:
    path: ../..
  add_2_calendar: ^3.1.1
  args: ^2.4.2
  image: ^4.12.0
  photo_manager: ^3.12.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
