name: privacy_guard_example
description: An on-device agent that finds ID cards, card numbers and other private details in photos before you share them, and blacks them out, through llamadart's tool calling and vision input.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  flutter:
    sdk: flutter
  llamadart:
    path: ../..
  args: ^2.4.2
  image: ^4.12.0
  image_picker: ^1.2.4
  path_provider: ^2.1.5
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
